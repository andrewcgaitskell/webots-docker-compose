#VRML_SIM R2025a utf8
# TPBot - two-wheel differential drive robot with front caster and dual line sensors.
#
# Coordinate convention: X = forward, Y = left, Z = up. Robot origin (0,0,0)
# sits on the ground plane at the centre of the wheel footprint.
#
# Source measurements (2026-08):
#   Chassis:      110mm (L) x 90mm (W) x 80mm (H)
#   Wheels:       60mm diameter, 18mm width
#   Wheel gap:    94mm (inner face to inner face) -> robot overall width = 94 + 2*18 = 130mm
#   Rear axle:    33mm forward of chassis back face
#   Caster:       15mm diameter ball bearing, front, 25mm behind chassis front face
#   Line sensors: 10mm behind caster centre, 15mm apart, either side of centreline
#   Mass:         350g total (no batteries fitted)
#
# ASSUMPTIONS (not specified by measurement - adjust as needed):
#   - Mass split: 20g per drive wheel, 10g caster, remainder (300g) on chassis body
#   - Ground clearance: chassis underside sits level with wheel axle height (30mm)
#   - Line sensor lookupTable: calibrated for a 10mm sensor mount height and a
#     floor with roughness=0.3 (see worlds/tpbot.wbt) using the infra-red
#     reflection-factor formula - if the mount height, floor roughness, or the
#     printed line's black/white contrast changes, these tables need
#     recalculating, not just re-guessed. See the comment above the
#     DistanceSensor nodes below for the derivation.
#   - REQUIRES the ground texture to be on a literal Plane node (not the Floor
#     PROTO, which uses an IndexedFaceSet) - Webots' infra-red color-sensitivity
#     silently fails to report red_level on non-Plane geometry.

PROTO TPBot [
  field SFVec3f    translation      0 0 0
  field SFRotation rotation         0 0 1 0
  field SFString   name             "TPBot"
  field SFString   controller       "<generic>"
  field MFString   controllerArgs   []
  field SFString   customData       ""
  field SFBool     supervisor       FALSE
  field SFBool     synchronization  TRUE
  field SFColor    bodyColor        0.2 0.5 0.9
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      # ---- Chassis body (visual) ----
      Transform {
        translation 0 0 0.07
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS bodyColor
              roughness 0.6
              metalness 0
            }
            geometry Box {
              size 0.11 0.09 0.08
            }
          }
        ]
      }

      # ---- Left drive wheel (+Y) ----
      HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          axis 0 1 0
          anchor -0.022 0.056 0.03
        }
        device [
          RotationalMotor {
            name "left wheel motor"
            maxVelocity 15
          }
          PositionSensor {
            name "left wheel sensor"
          }
        ]
        endPoint Solid {
          translation -0.022 0.056 0.03
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.08 0.08 0.08
                roughness 0.8
              }
              geometry Cylinder {
                radius 0.03
                height 0.018
              }
            }
          ]
          name "left wheel"
          boundingObject Cylinder {
            radius 0.03
            height 0.018
          }
          physics Physics {
            density -1
            mass 0.02
          }
        }
      }

      # ---- Right drive wheel (-Y) ----
      HingeJoint {
        jointParameters HingeJointParameters {
          position 0
          axis 0 1 0
          anchor -0.022 -0.056 0.03
        }
        device [
          RotationalMotor {
            name "right wheel motor"
            maxVelocity 15
          }
          PositionSensor {
            name "right wheel sensor"
          }
        ]
        endPoint Solid {
          translation -0.022 -0.056 0.03
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.08 0.08 0.08
                roughness 0.8
              }
              geometry Cylinder {
                radius 0.03
                height 0.018
              }
            }
          ]
          name "right wheel"
          boundingObject Cylinder {
            radius 0.03
            height 0.018
          }
          physics Physics {
            density -1
            mass 0.02
          }
        }
      }

      # ---- Front caster: 15mm ball bearing (simplified as a fixed low-friction ball, not a swivel joint) ----
      Solid {
        translation 0.03 0 0.0075
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.05 0.05 0.05
              roughness 0.9
              metalness 1
            }
            geometry Sphere {
              radius 0.0075
            }
          }
        ]
        name "caster"
        boundingObject Sphere {
          radius 0.0075
        }
        physics Physics {
          density -1
          mass 0.01
        }
      }

      # ---- Line sensors (underside, 10mm behind caster centre, 15mm apart, 10mm above ground) ----
      #
      # "infra-red" DistanceSensor is color-sensitive: Webots divides the raw
      # ray distance by a reflection factor f = 0.2 + 0.8*red_level*(1-0.5*roughness)
      # before the lookupTable is applied (see DistanceSensor docs, "Infra-Red
      # Sensors"). At this sensor's 10mm mount height (translation z=0.01,
      # matching the real hardware) and the floor's roughness=0.3 (set in the
      # world file):
      #   white (red_level=1): f = 0.2 + 0.8*1*(1-0.15)   = 0.88  -> effective distance = 0.01/0.88 ~= 0.0114m
      #   black (red_level=0): f = 0.2                     = 0.20  -> effective distance = 0.01/0.20 ~= 0.0500m
      # The lookupTable below spans that real range (with a little margin
      # either side), not the raw 10mm physical distance - a table confined to
      # the physical distance range cannot distinguish black from white at
      # all, since both readings collapse to ~0.01m before the reflection
      # factor is applied. Convention: higher output = black/on-line, matching
      # the C++/CODAL firmware's LineState::Black polarity.
      DistanceSensor {
        translation 0.02 0.0075 0.01
        rotation 0 1 0 1.5708
        name "line sensor left"
        type "infra-red"
        lookupTable [
          0.010 0    0
          0.055 1000 0
        ]
      }
      DistanceSensor {
        translation 0.02 -0.0075 0.01
        rotation 0 1 0 1.5708
        name "line sensor right"
        type "infra-red"
        lookupTable [
          0.010 0    0
          0.055 1000 0
        ]
      }
    ]
    name IS name
    boundingObject Transform {
      translation 0 0 0.07
      children [
        Box {
          size 0.11 0.09 0.08
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.30
    }
  }
}
